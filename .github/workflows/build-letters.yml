name: Build letters

on:
  push:
    branches: [main]
    paths: ["posts/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_letters.py
      - name: Commit the built pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add letters sitemap.xml feed.xml
          git diff --cached --quiet || (git commit -m "Build letters pages" && git push)
